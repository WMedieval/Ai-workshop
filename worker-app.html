<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Prijava radnika – BauMind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #0d0d0d; 
            color: #e0e0e0; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #181818;
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #c87a2b, #e8a84c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }
        .logo i {
            font-size: 48px;
            color: #c87a2b;
            display: block;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #f44336;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #121212;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #c87a2b;
            box-shadow: 0 0 0 3px rgba(200, 122, 43, 0.2);
        }
        .form-group input[type="file"] {
            padding: 12px;
            border: 1px dashed #c87a2b;
            background: transparent;
            color: #aaa;
            cursor: pointer;
        }
        .form-group input[type="file"]::file-selector-button {
            background: #c87a2b;
            border: none;
            color: #0d0d0d;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 12px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #c87a2b;
            cursor: pointer;
        }
        .checkbox-group label {
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #c87a2b, #e8a84c);
            color: #0d0d0d;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(200, 122, 43, 0.3);
        }
        .success-msg {
            display: none;
            margin-top: 20px;
            padding: 16px 20px;
            background: #1a3a1a;
            border-radius: 12px;
            border-left: 4px solid #4caf50;
            color: #81c784;
            font-size: 15px;
        }
        .success-msg i {
            margin-right: 10px;
            color: #4caf50;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 12px;
        }
        .footer a {
            color: #c87a2b;
            text-decoration: none;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #0d0d0d;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-submit.loading .spinner {
            display: inline-block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }
        .hitne-tag {
            display: inline-block;
            background: #2a1a1a;
            color: #ff8a80;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 6px;
            border: 1px solid #f4433655;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <i class="fas fa-helmet-safety"></i>
        <h1>BauMind</h1>
        <p>Prijava za građevinske radnike</p>
    </div>

    <form id="workerForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>Ime i prezime <span class="required">*</span></label>
            <input type="text" id="regIme" placeholder="Unesite ime i prezime" required />
        </div>
        <div class="form-group">
            <label>Godine <span class="required">*</span></label>
            <input type="number" id="regGodine" placeholder="18-70" min="18" max="70" required />
        </div>
        <div class="form-group">
            <label>Glavna struka <span class="required">*</span></label>
            <select id="regStruka" required>
                <option value="">Izaberi...</option>
                <option value="zidar">Zidar</option>
                <option value="elektricar">Električar</option>
                <option value="keramicar">Keramičar</option>
                <option value="vodoinstalater">Vodoinstalater</option>
                <option value="gipsar">Gipsar</option>
                <option value="molers">Molers</option>
                <option value="stolar">Stolar</option>
                <option value="armirac">Armirač</option>
                <option value="drugi">Drugi</option>
            </select>
            <div style="margin-top:6px; font-size:12px; color:#666;">
                ⚡ Tražene struke: <span class="hitne-tag">Zidar</span> <span class="hitne-tag">Električar</span> <span class="hitne-tag">Keramičar</span>
            </div>
        </div>
        <div class="form-group">
            <label>Dodatne veštine</label>
            <input type="text" id="regVestine" placeholder="npr. keramika, gips, pločice" />
        </div>
        <div class="form-group">
            <label>Telefon <span class="required">*</span></label>
            <input type="tel" id="regTelefon" placeholder="+381 63 123 456" required />
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="email@primer.com" />
        </div>
        <div class="form-group">
            <label>Grad <span class="required">*</span></label>
            <input type="text" id="regGrad" placeholder="Beograd, Novi Sad..." required />
        </div>
        <div class="form-group">
            <label>📎 Upload CV (PDF ili Word)</label>
            <input type="file" id="regCv" accept=".pdf,.doc,.docx" />
            <div style="margin-top:4px; font-size:12px; color:#666;">Maksimalna veličina: 5MB</div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="regSaglasnost" required />
            <label for="regSaglasnost">Saglasan/na sam sa obradom podataka <span class="required">*</span></label>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text"><i class="fas fa-paper-plane"></i> Pošalji prijavu</span>
            <span class="spinner"></span>
        </button>
    </form>

    <div class="success-msg" id="successMsg">
        <i class="fas fa-check-circle"></i>
        Prijava uspešno poslata! Hvala na interesovanju.
        <br><small style="color:#666;">Vaš profil će biti vidljiv firmama u roku od 24h.</small>
    </div>

    <div class="footer">
        <p>🏗️ BauMind AI – <a href="#" onclick="window.location.href='index.html'">Povratak na početnu</a></p>
    </div>
</div>

<script>
    const HITNE_STRUKE = ['zidar', 'elektricar', 'keramicar'];

    document.getElementById('workerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const ime = document.getElementById('regIme').value.trim();
        const godine = document.getElementById('regGodine').value;
        const struka = document.getElementById('regStruka').value;
        const telefon = document.getElementById('regTelefon').value.trim();
        const grad = document.getElementById('regGrad').value.trim();
        const saglasnost = document.getElementById('regSaglasnost').checked;

        if (!ime) { alert('Unesite ime i prezime.'); return; }
        if (!godine || godine < 18 || godine > 70) { alert('Unesite godine (18-70).'); return; }
        if (!struka) { alert('Izaberite struku.'); return; }
        if (!telefon) { alert('Unesite telefon.'); return; }
        if (!grad) { alert('Unesite grad.'); return; }
        if (!saglasnost) { alert('Morate prihvatiti saglasnost za obradu podataka.'); return; }

        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');

        const radnik = {
            id: Date.now(),
            ime: ime,
            godine: parseInt(godine),
            struka: struka,
            vestine: document.getElementById('regVestine').value.trim(),
            telefon: telefon,
            email: document.getElementById('regEmail').value.trim(),
            grad: grad,
            cvFajl: document.getElementById('regCv').files[0]?.name || null,
            datumPrijave: new Date().toISOString(),
            hitna: HITNE_STRUKE.includes(struka)
        };

        let savedRadnici = JSON.parse(localStorage.getItem('baumind_radnici') || '[]');
        savedRadnici.push(radnik);
        localStorage.setItem('baumind_radnici', JSON.stringify(savedRadnici));

        if (radnik.hitna) {
            let alerti = JSON.parse(localStorage.getItem('baumind_alerti') || '[]');
            alerti.push({
                radnikId: radnik.id,
                ime: radnik.ime,
                struka: radnik.struka,
                telefon: radnik.telefon,
                vreme: new Date().toISOString()
            });
            localStorage.setItem('baumind_alerti', JSON.stringify(alerti));
        }

        setTimeout(() => {
            btn.classList.remove('loading');
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('workerForm').reset();
            document.getElementById('successMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 1500);
    });

    // Auto-fill za testiranje
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
            if (!document.getElementById('regIme').value) {
                document.getElementById('regIme').value = 'Petar Petrović';
                document.getElementById('regGodine').value = '35';
                document.getElementById('regStruka').value = 'zidar';
                document.getElementById('regVestine').value = 'keramika, gips';
                document.getElementById('regTelefon').value = '+381 64 123 456';
                document.getElementById('regEmail').value = 'petar@email.com';
                document.getElementById('regGrad').value = 'Beograd';
                document.getElementById('regSaglasnost').checked = true;
            }
        }, 300);
    });
</script>
</body>
</html>
